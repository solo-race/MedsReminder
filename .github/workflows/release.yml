name: Release

on:
  workflow_dispatch:
    inputs:
      restore_bridge:
        description: "Build a temporary debuggable beta.10 APK signed for data restoration"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.restore_bridge && 'v1.0.0-beta.10' || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Write signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint and build release APK
        run: ./gradlew lintRelease assembleRelease --no-daemon

      - name: Build temporary data restoration bridge
        if: github.event_name == 'workflow_dispatch' && inputs.restore_bridge
        run: |
          cat > "$RUNNER_TEMP/restore-bridge.init.gradle" <<'EOF'
          allprojects {
              plugins.withId('com.android.application') {
                  androidComponents.finalizeDsl { android ->
                      android.buildTypes.getByName('release').debuggable = true
                  }
              }
          }
          EOF
          ./gradlew assembleRelease --no-daemon --init-script "$RUNNER_TEMP/restore-bridge.init.gradle"

      - name: Upload temporary data restoration bridge
        if: github.event_name == 'workflow_dispatch' && inputs.restore_bridge
        uses: actions/upload-artifact@v4
        with:
          name: release-data-restore-bridge
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 1

      - name: Upload failing test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
